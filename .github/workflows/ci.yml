name: ci

on:
  pull_request:
    branches: [ "**" ]

permissions: {}

jobs:

  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Load tool versions
        run: cat .github/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install deps
        run: make install-deps
      - uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: ${{ env.PREK_VERSION }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Load tool versions
        run: cat .github/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install deps
        run: make install-deps
      - name: Cache pcap corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test/corpus
          key: corpus-${{ hashFiles('test/corpus.txt') }}
      - name: Fetch pcap corpus
        run: make corpus
      - name: Run tests
        run: make test
